utton><p id="pending"></p></section><section data-block="orders" class="panel"><h2>طلباتي</h2><div class="scroll"><table><thead><tr><th>المبلغ</th><th>الحالة</th><th>المرجع</th><th>الإجراء</th></tr></thead><tbody id="orders"></tbody></table></div><button id="orderFirst" type="button">الأولى</button><button id="orderNext" type="button">التالي</button></section></div></main><script type="module" src="storefront.mjs"></script></body></html>
