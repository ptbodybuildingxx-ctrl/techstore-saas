name: TechStore SaaS checks
on:
  push:
    branches: [saas/development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test saas/tests/*.test.mjs
      - run: npm run verify
